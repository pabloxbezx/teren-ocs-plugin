[package]
name = "teren_plugin"
version = "1.0.8"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Ukázka okna Prospektoru bez Open CAD Studia (examples/ukazka_okna.rs).
ukazka = []

[[example]]
name = "ukazka_okna"
required-features = ["ukazka"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11"] }
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", rev = "fb0a667e269b6c924233ecd450a11dd7cba40eea", features = ["host"] }
teren = { path = ".." }
png = "0.17"
egui_extras = { version = "0.36.2", default-features = false, features = ["svg"] }
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
arboard = { version = "3", default-features = false }

# systémový dialog výběru souboru (okno importu); jinde přetažení a cesta
[target.'cfg(windows)'.dependencies]
rfd = "0.18.0"
