[package]
name = "teren_plugin"
version = "1.4.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Ukázka okna Prospektoru bez Open CAD Studia (examples/ukazka_okna.rs).
ukazka = []

[[example]]
name = "ukazka_okna"
required-features = ["ukazka"]

[dependencies]
teren_lang = { path = "../lang" }
bincode = "1.3.3"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11"] }
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", rev = "8e5f39f6ee0468a7e29260d57b5390d7d01207e8", features = ["host"] }
teren = { path = ".." }
trasy = { path = "../trasy" }
png = "0.17"
egui_extras = { version = "0.36.2", default-features = false, features = ["svg"] }
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
arboard = { version = "3", default-features = false }

# systémový dialog výběru souboru (okno importu); jinde přetažení a cesta
[target.'cfg(windows)'.dependencies]
rfd = "0.18.0"
