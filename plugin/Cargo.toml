[package]
name = "teren_plugin"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11"] }
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", rev = "0e77cae652271d08c7619238e619f9b6668ae17c", features = ["host"] }
teren = { path = ".." }
png = "0.17"
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
