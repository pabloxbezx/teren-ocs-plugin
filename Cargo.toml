[package]
name = "teren"
version = "0.1.0"
edition = "2024"

[dependencies]
calamine = { version = "0.38.0", default-features = false }
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8.42"
spade = "2"

[workspace]
members = [".", "plugin"]

[profile.release]
opt-level = 3

# Knihovna DWG (acadrust) je obrovská – s plnou optimalizací se na běžném
# počítači sestavuje desítky minut a bere mnoho paměti. Plugin z ní používá
# jen datové typy, takže nižší optimalizace nevadí.
[profile.release.package.acadrust]
opt-level = 1

[dev-dependencies]
zip = { version = "9", default-features = false }

